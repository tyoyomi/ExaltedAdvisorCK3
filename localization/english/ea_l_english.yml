 setting_ea_rule_heir_tutoring_on:0 "On"
 setting_ea_rule_heir_tutoring_on_desc:0 "Children educated by an Exalted Advisor gain lifestyle XP crumbs each year (specialty-flavored when assigned). High intensity may grant one perk point once. Soft peer to Supreme Sovereign Reshape Heir — does not replace it."
