 setting_ea_rule_vassal_loyalty_on:0 "On"
 setting_ea_rule_vassal_loyalty_on_desc:0 "Exalted Vassals periodically refresh Soft Glue–lite loyalty toward their patron. Mid/High intensity may also drip a weak favor hook — never a strong hook / Demand Strong Hook clone."
 setting_ea_rule_vassal_loyalty_off:0 "Off"
 setting_ea_rule_vassal_loyalty_off_desc:0 "No loyalty pulse or weak-hook drip from Exalted Vassals."

